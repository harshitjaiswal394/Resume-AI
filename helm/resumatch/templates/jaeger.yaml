{{- if .Values.jaeger.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jaeger-data
  namespace: {{ .Values.global.namespace }}
  labels:
    app: jaeger
spec:
  accessModes:
{{- range .Values.jaeger.persistence.accessModes }}
  - {{ . }}
{{- end }}
  storageClassName: {{ .Values.jaeger.persistence.storageClassName | quote }}
  resources:
    requests:
      storage: {{ .Values.jaeger.persistence.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: {{ .Values.global.namespace }}
  labels:
    app: jaeger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
      - name: jaeger
        image: "{{ .Values.jaeger.image.repository }}:{{ .Values.jaeger.image.tag }}"
        imagePullPolicy: {{ .Values.jaeger.image.pullPolicy }}
        env:
        - name: COLLECTOR_OTLP_ENABLED
          value: "true"
        - name: SPAN_STORAGE_TYPE
          value: badger
        - name: BADGER_EPHEMERAL
          value: "false"
        - name: BADGER_DIRECTORY_VALUE
          value: /badger/data
        - name: BADGER_DIRECTORY_KEY
          value: /badger/key
        ports:
        - containerPort: 16686
          name: query-http
        - containerPort: 4317
          name: otlp-grpc
        - containerPort: 4318
          name: otlp-http
        volumeMounts:
        - name: jaeger-data
          mountPath: /badger
        resources:
{{ toYaml .Values.jaeger.resources | indent 10 }}
      volumes:
      - name: jaeger-data
        persistentVolumeClaim:
          claimName: jaeger-data
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-service
  namespace: {{ .Values.global.namespace }}
spec:
  ports:
  - name: query-http
    port: 16686
    targetPort: 16686
    protocol: TCP
  - name: otlp-grpc
    port: 4317
    targetPort: 4317
    protocol: TCP
  - name: otlp-http
    port: 4318
    targetPort: 4318
    protocol: TCP
  selector:
    app: jaeger
{{- end }}
