# Global settings
global:
  domain: jaiswal.shop
  namespace: resumatch-ai

# Backend service configurations
backend:
  replicaCount: 2
  image:
    repository: ghcr.io/harshitjaiswal394/resume-ai-backend
    tag: latest
    pullPolicy: Always
  service:
    port: 8090
  resources:
    limits:
      cpu: "1"
      memory: "1Gi"
    requests:
      cpu: "250m"
      memory: "512Mi"
  config:
    SUPABASE_URL: "https://your-project.supabase.co"
  security:
    AI_SECURITY_ENABLED: "true"
    AI_INJECTION_ENABLED: "true"
    AI_INJECTION_BLOCK_THRESHOLD: "0.75"
    AI_INJECTION_WARN_THRESHOLD: "0.40"
    AI_PII_ENABLED: "true"
    AI_PII_MASK_BEFORE_PROVIDER: "true"
    AI_PII_BLOCK_MODE: "false"
    AI_TOOL_PERMISSIONS_ENABLED: "true"
    AI_RATE_LIMIT_ENABLED: "true"
    AI_AUDIT_ENABLED: "true"
    AI_AUDIT_PROMPT_CAPTURE: "false"
    AI_AUDIT_DB_BACKEND: "true"
    AI_PROMPT_VERSIONING_ENABLED: "true"
    AI_OUTPUT_VALIDATION_ENABLED: "true"
    AI_OUTPUT_MAX_LENGTH: "20000"
    AI_MESSAGE_MAX_LENGTH: "8000"
  podSecurity:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
  secrets:
    DATABASE_URL: ""
    SUPABASE_SERVICE_ROLE_KEY: ""
    NEXT_PUBLIC_SUPABASE_ANON_KEY: ""
    NVIDIA_API_KEY_REASONING: ""
    NVIDIA_API_KEY_PARSING: ""
    NVIDIA_API_KEY_EMBEDDING: ""
    NVIDIA_API_KEY_RERANKING: ""
    NVIDIA_API_KEY: ""
    NVIDIA_LLM_MODEL: "meta/llama-3.1-70b-instruct"
    GEMINI_API_KEY: ""
    OPENAI_API_KEY: ""
    ANTHROPIC_API_KEY: ""
    GOOGLE_CLOUD_PROJECT: ""
    GOOGLE_CLOUD_LOCATION: "global"
    GOOGLE_GENAI_USE_VERTEXAI: "true"
    VERTEX_GEMINI_MODEL: "gemini-2.5-flash"
    DEFAULT_PROVIDER: "vertex-gemini"
    RAZORPAY_KEY_ID: ""
    RAZORPAY_KEY_SECRET: ""
    RAZORPAY_WEBHOOK_SECRET: ""
    CRON_SECRET: ""

# Frontend service configurations
frontend:
  replicaCount: 2
  image:
    repository: ghcr.io/harshitjaiswal394/resume-ai-frontend
    tag: latest
    pullPolicy: Always
  service:
    port: 3000
  resources:
    limits:
      cpu: "1"
      memory: "1Gi"
    requests:
      cpu: "250m"
      memory: "512Mi"
  # Frontend uses the same Supabase/API config

jaeger:
  enabled: true
  image:
    repository: jaegertracing/all-in-one
    tag: "1.57"
    pullPolicy: IfNotPresent
  persistence:
    enabled: true
    storageClassName: standard-rwo
    accessModes:
    - ReadWriteOnce
    size: 10Gi
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
    requests:
      cpu: "100m"
      memory: "256Mi"
