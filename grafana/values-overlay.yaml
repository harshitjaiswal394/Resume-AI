# =============================================================================
# Resume-AI Grafana provisioning overlay for kube-prometheus-stack
# -----------------------------------------------------------------------------
# Usage:  helm upgrade prometheus prometheus-community/kube-prometheus-stack \
#           -n monitoring -f kubernetes/persistent.yaml -f grafana/values-overlay.yaml
#
# - Grafana sidecar picks up dashboards (label grafana_dashboard) and the
#   Prometheus datasource (label grafana_datasource) from ConfigMaps.
# - The alerting provisioning bundle is mounted straight into
#   /etc/grafana/provisioning/alerting (alert rules + email template).
# =============================================================================
grafana:
  # NOTE: the stack provisions its own "Prometheus" datasource marked
  # default. Ours (datasources.yaml) uses a stable UID `resumatch-prom` that
  # the alert rules reference; it is intentionally NOT marked default to avoid
  # the "only one datasource can be default" startup error. If you want ours
  # default instead, keep defaultDatasourceEnabled: false AND remove the
  # stack's datasource ConfigMap (see runbook).
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
    datasources:
      enabled: true
      label: grafana_datasource
  extraConfigmapMounts:
    - name: grafana-resumatch-alerting
      mountPath: /etc/grafana/provisioning/alerting
      configMap: grafana-resumatch-alerting
      readOnly: true
