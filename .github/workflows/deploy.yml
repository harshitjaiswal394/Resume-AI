name: Deploy to Cloud Run (jaiswal.shop)

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "dev-feat" , "main", "dev-domain", "dev-major", "dev-major-fix" ]
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-east1
  REPOSITORY: resumatches-official
  DOMAIN: jaiswal.shop

permissions:
  contents: read
  id-token: write

jobs:
  test-backend:
    name: "Backend Tests"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest

      - name: Run Pytest
        working-directory: ./backend
        run: python -m pytest tests -q

  build-and-push:
    name: "Build & Push Images"
    needs: test-backend
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Secret Sanity Check
        run: |
          ERROR=0
          if [ -z "${{ secrets.DATABASE_URL }}" ]; then echo "::error::DATABASE_URL secret is MISSING"; ERROR=1; fi
          if [ -z "${{ secrets.SUPABASE_URL }}" ]; then echo "::error::SUPABASE_URL secret is MISSING"; ERROR=1; fi
          if [ -z "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" ]; then echo "::error::SUPABASE_SERVICE_ROLE_KEY secret is MISSING"; ERROR=1; fi
          if [ -z "${{ secrets.NVIDIA_API_KEY_REASONING }}" ]; then echo "::error::NVIDIA_API_KEY_REASONING secret is MISSING"; ERROR=1; fi
          if [ "$ERROR" -eq 1 ]; then exit 1; fi
          echo "Secret check PASSED."

      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build & Push Backend
        run: |
          docker build -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/backend:${{ github.sha }} ./backend
          docker tag ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/backend:${{ github.sha }} ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/backend:latest
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/backend --all-tags

      - name: Build & Push Frontend
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}" \
            --build-arg NEXT_PUBLIC_BACKEND_API_URL="https://${{ env.DOMAIN }}" \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/frontend:${{ github.sha }} ./frontend
          docker tag ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/frontend:${{ github.sha }} ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/frontend:latest
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/frontend --all-tags

  deploy:
    name: "Deploy Terraform (Cloud Run + LB)"
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: dev
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init
        working-directory: terraform/cloudflare

      - name: Terraform Apply
        run: |
          terraform apply -auto-approve \
            -var="project_id=${{ env.PROJECT_ID }}" \
            -var="region=${{ env.REGION }}" \
            -var="repository=${{ env.REPOSITORY }}" \
            -var="domain_name=${{ env.DOMAIN }}" \
            -var="database_url=${{ secrets.DATABASE_URL }}" \
            -var="nvidia_api_key_reasoning=${{ secrets.NVIDIA_API_KEY_REASONING }}" \
            -var="nvidia_api_key_parsing=${{ secrets.NVIDIA_API_KEY_PARSING }}" \
            -var="nvidia_api_key_embedding=${{ secrets.NVIDIA_API_KEY_EMBEDDING }}" \
            -var="nvidia_api_key_reranking=${{ secrets.NVIDIA_API_KEY_RERANKING }}" \
            -var="supabase_url=${{ secrets.SUPABASE_URL }}" \
            -var="supabase_service_role_key=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -var="image_tag=${{ github.sha }}"
        working-directory: terraform/cloudflare

      - name: Report Load Balancer IP
        run: |
          echo "LB IP to point ${{ env.DOMAIN }} at in Cloudflare:"
          terraform output -raw load_balancer_ip
          echo ""
          echo "Managed cert status:"
          terraform output managed_cert_expiry
        working-directory: terraform/cloudflare

