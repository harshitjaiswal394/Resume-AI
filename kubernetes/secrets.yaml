apiVersion: v1
kind: Secret
metadata:
  name: resumatch-secrets
  namespace: resumatch-ai
type: Opaque
stringData:
  # Database connection strings
  DATABASE_URL: "postgresql://postgres:[change-me]@db.[project].supabase.co:6543/postgres?sslmode=require"
  GCP_DATABASE_URL: "postgresql://resumatch_app:[change-me]@[gcp-host]:5432/resumatch_staging"

  # Supabase Auth
  SUPABASE_SERVICE_ROLE_KEY: "change-me-supabase-service-role-key"
  NEXT_PUBLIC_SUPABASE_ANON_KEY: "change-me-supabase-anon-key"

  # AI API Keys (NVIDIA NIM)
  NVIDIA_API_KEY_REASONING: "change-me-nvidia-reasoning"
  NVIDIA_API_KEY_PARSING: "change-me-nvidia-parsing"
  NVIDIA_API_KEY_EMBEDDING: "change-me-nvidia-embedding"
  NVIDIA_API_KEY_RERANKING: "change-me-nvidia-reranking"
  NVIDIA_API_KEY: "change-me-nvidia-general"

  # Google Gemini
  GEMINI_API_KEY: "change-me-gemini"
  NEXT_PUBLIC_GEMINI_API_KEY: "change-me-gemini"

  # Anthropic Claude
  ANTHROPIC_API_KEY: "change-me-anthropic"

  # Razorpay Integrations
  RAZORPAY_KEY_ID: "change-me-razorpay-id"
  RAZORPAY_KEY_SECRET: "change-me-razorpay-secret"
  RAZORPAY_WEBHOOK_SECRET: "change-me-razorpay-webhook"

  # App Cron
  CRON_SECRET: "change-me-cron-token"

  # Firebase (used by frontend)
  NEXT_PUBLIC_FIREBASE_API_KEY: "change-me-firebase-api-key"
  NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "change-me.firebaseapp.com"
  NEXT_PUBLIC_FIREBASE_PROJECT_ID: "resumatch-ai-c5938"
  NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "change-me.appspot.com"
  NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
  NEXT_PUBLIC_FIREBASE_APP_ID: "1:000000000000:web:change-me"
