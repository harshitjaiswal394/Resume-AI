prometheus:
  prometheusSpec:
    serviceMonitorNamespaceSelector: {} # Allows cross-namespace metrics scraping
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: "standard-rwo" #  Updated for GKE Default Balanced PD
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

grafana:
  adminPassword: "change-me" # Set via a Kubernetes Secret; never commit a real password
  persistence:
    enabled: true
    storageClassName: "standard-rwo" #  Updated for GKE Default Balanced PD
    accessModes: ["ReadWriteOnce"]
    size: 5Gi
    skipCleanup: true
  env:
    GF_SERVER_ROOT_URL: "https://grafana.jaiswal.shop/"
    GF_SERVER_SERVE_FROM_SUB_PATH: "false"
    # SMTP — email alerts. Use a Gmail App Password (not your login password).
    # Ref: https://support.google.com/accounts/answer/185833
    GF_SMTP_ENABLED: "true"
    GF_SMTP_HOST: smtp.gmail.com:587
    GF_SMTP_USER: "REPLACE_ME_YOUR_GMAIL@gmail.com"
    GF_SMTP_PASSWORD: "REPLACE_ME_GMAIL_APP_PASSWORD"
    GF_SMTP_FROM_ADDRESS: "REPLACE_ME_YOUR_GMAIL@gmail.com"
    GF_SMTP_STARTTLS_POLICY: "OpportunisticStartTLS"